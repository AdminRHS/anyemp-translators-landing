version: '3.8'

services:
  app:
    image: nginx:alpine
    container_name: translators-landing
    restart: unless-stopped
    volumes:
      - .:/usr/share/nginx/html:ro
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.translators-landing.rule=Host(`trn-s.com`) || Host(`www.trn-s.com`)"
      - "traefik.http.routers.translators-landing.entrypoints=https"
      - "traefik.http.routers.translators-landing.tls=true"
      - "traefik.http.routers.translators-landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.translators-landing.loadbalancer.server.port=80"

      # www → apex redirect
      - "traefik.http.middlewares.translators-www-redirect.redirectregex.regex=^https://www\\.trn-s\\.com(.*)"
      - "traefik.http.middlewares.translators-www-redirect.redirectregex.replacement=https://trn-s.com$${1}"
      - "traefik.http.middlewares.translators-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.translators-landing.middlewares=translators-www-redirect"

networks:
  traefik-public:
    external: true
