<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Hazel — Translator Vacancy — Translators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /*
    New 2026-08-13 — moved out of index.html's Notice Board stop into its
    own standalone page, per direct request. Real background prompt
    written for this screen (11_Background_Prompts/11_BACKGROUND_PROMPTS.md
    §5-new, "Ask Hazel") — generated and wired in same day
    (09_Ask_Hazel.png). Hazel sits on the left of that composition, so the
    chat is positioned on the right, over the open river/bridge side.
    Still image only — swap for <video class="page-bg"> once an animated
    version exists (motion prompt written, 12_ANIMATION_PROMPTS.md #9).

    Real mechanism, unchanged from the inline version: a fixed,
    pre-written FAQ, not a live AI backend — see
    04_Chat_With_Mascot/OUT_OF_SCOPE.md for why (same real decision LGN's
    own team already made for Mary, 04_CHAT_WITH_MARY.md). Click a
    question, get Hazel's pre-written answer. No free-text input, no API.
  */
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    font-family:'Open Sans', sans-serif;
    color:#fff;
    min-height:100vh;
    background:#08120f;
    position:relative;
    overflow-x:hidden;
  }
  /* Real still now generated (§5-new in 11_BACKGROUND_PROMPTS.md,
     09_Ask_Hazel.png) — Hazel sits on the left of that composition, so
     content is positioned on the right, over the open river/bridge side,
     instead of centered on top of her. */
  .page-bg{
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:0; pointer-events:none;
  }
  .page-overlay{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(270deg, rgba(6,16,13,0.62) 0%, rgba(6,16,13,0.15) 45%, rgba(6,16,13,0) 68%);
  }
  .page-content{
    position:relative; z-index:2; min-height:100vh;
    display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
    padding:32px 7vw;
  }
  :root{
    /* PLACEHOLDER — no real Translators department color assigned yet */
    --dept-trn: #6fb3ac;
    --dept-trn-rgb: 111, 179, 172;
    --font-display: 'Poppins', sans-serif;
    --tshadow: 0 2px 14px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.9);
  }

  .corner-logo{
    /* Real fix, 2026-08-18 — swapped to the real Translators logo, matching
       index.html. Follow-up same day: wordmark recolored navy → white in
       the SVG itself, sized up again per Iryna's direct request. */
    position:fixed; top:18px; left:20px; z-index:10;
    width:158px; height:auto; object-fit:contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
  }
  .back-link{
    position:fixed; top:26px; right:24px; z-index:10;
    font-family:'Open Sans', sans-serif; font-size:0.85rem; font-weight:600;
    color: var(--dept-trn); text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
  }
  .back-link:hover{ text-decoration:underline; }

  .page-header{ text-align:right; max-width:480px; margin-bottom:26px; }
  .eyebrow{
    font-family: var(--font-display); font-weight:700; font-size:13px;
    letter-spacing:0.14em; text-transform:uppercase; color: var(--dept-trn);
    margin-bottom:14px; text-shadow: var(--tshadow);
  }
  h1{
    font-family: var(--font-display); font-weight:700;
    font-size:clamp(1.7rem, 4vw, 2.4rem); line-height:1.3;
    text-shadow: var(--tshadow); margin-bottom:12px;
  }
  h1 .accent{ color: var(--dept-trn); }
  .lede{ font-size:0.98rem; color:rgba(255,255,255,0.85); line-height:1.6; text-shadow: var(--tshadow); }

  .hazel-chat{
    width:100%; max-width:560px; text-align:left;
    background: rgba(8,18,15,0.6);
    border:1px solid rgba(var(--dept-trn-rgb),0.3);
    border-radius:16px;
    padding:22px 22px 20px;
    backdrop-filter: blur(10px);
  }
  .chat-log{
    display:flex; flex-direction:column; gap:10px;
    max-height:320px; overflow-y:auto; margin-bottom:16px;
    padding-right:4px;
  }
  .chat-log:empty{ display:none; }
  .chat-bubble{
    font-size:0.92rem; line-height:1.55; padding:10px 14px; border-radius:10px;
    max-width:85%;
  }
  .chat-bubble.bot{
    align-self:flex-start; background:rgba(255,255,255,0.08); color:#fff;
    border:1px solid rgba(var(--dept-trn-rgb),0.3);
  }
  .chat-bubble.user{
    align-self:flex-end; background: var(--dept-trn); color:#06120f; font-weight:600;
  }
  .chat-questions{ display:flex; flex-wrap:wrap; gap:9px; }
  .chat-q-btn{
    font-family:'Open Sans', sans-serif; font-size:0.85rem; font-weight:600; color: var(--dept-trn);
    background:transparent; border:1px solid rgba(var(--dept-trn-rgb),0.5);
    border-radius:999px; padding:8px 16px; cursor:pointer; transition:all .2s ease;
  }
  .chat-q-btn:hover{ background: rgba(var(--dept-trn-rgb),0.16); }
  .chat-q-btn.is-asked{ opacity:0.35; pointer-events:none; }

  .btn{
    font-family: var(--font-display); font-weight:600; font-size:0.9rem;
    padding:0.8rem 1.3rem; border-radius:10px; text-decoration:none;
    display:inline-flex; align-items:center; gap:8px;
    border:none; cursor:pointer;
  }
  .btn-trn{ background: var(--dept-trn); color:#06120f; }
  .btn-trn:hover{ background:#87c2bb; }
</style>
</head>
<body>

<video class="page-bg" src="11_Background_Prompts/Generated_Videos/09_Ask_Hazel.mp4" muted loop autoplay playsinline></video>
<div class="page-overlay"></div>

<a href="index.html#scene7" class="back-link">← Back to the Crossing</a>
<img class="corner-logo" src="assets/translators_logo.svg" alt="Translators">

<div class="page-content">
  <div class="page-header">
    <div class="eyebrow">Ask Hazel</div>
    <h1>Still have questions about the <span class="accent">vacancy</span>?</h1>
    <p class="lede">Ask Hazel — real answers about the role, before you apply.</p>
  </div>

  <div class="hazel-chat">
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-questions" id="chatQuestions"></div>
  </div>
</div>

<script>
(function(){
  // Fixed, pre-written FAQ — not a live AI backend. See
  // 04_Chat_With_Mascot/OUT_OF_SCOPE.md for the real scope reasoning.
  // Every answer is grounded in facts already established in
  // 01_CONTENT_AND_STRUCTURE.md / index.html — conversational phrasing is
  // new copy, the facts inside it are not.
  var faq = [
    {
      q: 'What does this role actually involve?',
      a: 'Text translation, researching contacts and companies, corresponding with clients on LinkedIn, and keeping the CRM up to date — real work, not busywork.'
    },
    {
      q: 'What languages do I need?',
      a: 'B1 level or better is required in whichever language you\'ll be working in — we hire across English, Spanish, French, and German, not just English.'
    },
    {
      q: 'What tools will I use?',
      a: 'Google Docs, LinkedIn, GPT chat, and CAT (computer-assisted translation) tools — nothing exotic, just used well.'
    },
    {
      q: 'Is this remote?',
      a: 'Fully remote, with real international projects across Europe, Canada, and the US.'
    },
    {
      q: 'What’s the schedule like?',
      a: 'Shift-based, with Saturdays and Sundays off — there’s more than one shift option, not just a single fixed schedule.'
    },
    {
      q: 'What’s the pay?',
      a: 'That’s not something I can share here on the bridge — message our recruiter directly on Telegram and ask them.',
      cta: true
    },
    {
      q: 'How do I apply?',
      a: 'Message our recruiter directly on Telegram — that’s the whole process.',
      cta: true
    }
  ];
  var chatLog = document.getElementById('chatLog');
  var chatQuestions = document.getElementById('chatQuestions');
  faq.forEach(function(item){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chat-q-btn';
    btn.textContent = item.q;
    btn.addEventListener('click', function(){
      var userBubble = document.createElement('div');
      userBubble.className = 'chat-bubble user';
      userBubble.textContent = item.q;
      chatLog.appendChild(userBubble);

      var botBubble = document.createElement('div');
      botBubble.className = 'chat-bubble bot';
      botBubble.textContent = item.a;
      chatLog.appendChild(botBubble);

      if(item.cta){
        var link = document.createElement('a');
        link.href = 'https://t.me/RemotEmployees_Ievgeniia';
        link.target = '_blank';
        link.rel = 'noopener';
        link.className = 'btn btn-trn';
        link.style.marginTop = '10px';
        link.style.display = 'inline-flex';
        link.textContent = 'Message on Telegram →';
        botBubble.appendChild(document.createElement('br'));
        botBubble.appendChild(link);
      }

      btn.classList.add('is-asked');
      chatLog.scrollTop = chatLog.scrollHeight;
    });
    chatQuestions.appendChild(btn);
  });
})();
</script>

</body>
</html>
